<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCO Portal - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card { 
            max-width: 480px; 
            width: 100%;
            margin: auto; 
            padding: 40px; 
            background: #ffffff; 
            border: 1px solid #e2e8f0;
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .brand-title { color: #0f172a; font-weight: 700; letter-spacing: -0.025em; font-size: 1.75rem; }
        .brand-subtitle { color: #64748b; font-size: 1rem; margin-bottom: 2rem; }
        .form-label { color: #334155; font-weight: 500; font-size: 1.05rem; margin-bottom: 6px; }
        .form-control { padding: 14px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; }
        .btn-premium { background-color: #0f172a; color: #ffffff; padding: 14px; font-size: 1.2rem; font-weight: 600; border-radius: 8px; border: none; }
        .divider { display: flex; align-items: center; text-align: center; color: #94a3b8; font-size: 0.9rem; margin: 20px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }
    </style>
</head>
<body>

<div class="container">
    <div class="login-card">
        <div class="text-center">
            <h2 class="brand-title">Secure SACCO Portal</h2>
            <p class="brand-subtitle">Enter your details to manage your savings</p>
        </div>
        
        <form action="/login" method="POST">
            <div class="mb-4">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password / Security PIN</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-premium w-100 mt-2">Log In Securely</button>
        </form>

        <div class="divider">or login with</div>

        <div class="d-flex justify-content-center">
            <div id="g_id_onload"
                 data-client_id="{{ google_client_id }}"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-login_uri="/login-google"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
        
        <div class="text-center mt-4">
            <span class="text-muted small">New to the group?</span> 
            <a href="/register" class="text-decoration-none small fw-medium text-primary">Apply to Join Here</a>
        </div>
    </div>
</div>

</body>
</html>
