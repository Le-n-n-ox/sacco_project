<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Inbox Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .verify-card { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); border: 1px solid #334155; border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-center; }
        .code-input { background-color: #0f172a !important; border: 2px solid #475569 !important; color: #38bdf8 !important; font-size: 2rem; font-weight: 800; letter-spacing: 8px; text-align: center; border-radius: 12px; }
        .code-input:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2) !important; }
    </style>
</head>
<body>

<div class="verify-card text-center">
    <div class="mb-4">
        <span class="fs-1">✉️</span>
        <h3 class="fw-extrabold text-white mt-2">Enter Verification Code</h3>
        <p class="text-muted small">We sent a security authorization PIN to <br><strong class="text-info">{{ email }}</strong></p>
    </div>

    <form action="/verify-code" method="POST">
        <div class="mb-4">
            <input type="text" name="code" class="form-control code-input" maxlength="6" placeholder="000000" required autocomplete="off">
        </div>
        <button type="submit" class="btn btn-info w-100 py-3 fw-bold rounded-3 text-white">Verify & Activate Account</button>
    </form>
</div>

</body>
</html>
